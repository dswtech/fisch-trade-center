<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: hybrid-02-search-first.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#080c27}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <figure class="r-brand-mark region plate" data-region="brand-mark"><img src="../../../assets/plates/brand-mark.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-topbar region chrome" data-region="topbar"><!-- dark utility header with global search and preference controls --></div>
  <div class="r-sidebar region chrome" data-region="sidebar"><!-- dark navigation rail with active item and secondary promo region --></div>
  <figure class="r-sidebar-ocean-art region plate" data-region="sidebar-ocean-art"><img src="../../../assets/plates/sidebar-ocean-art.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-search-workbench region chrome" data-region="search-workbench"><!-- full-width search and filter command bar --></div>
  <div class="r-search-input region control" data-region="search-input"><!-- labeled catalog search input: rebuild the control's chrome from the crop (comp-spec.mjs --crop search-input); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-search-filters region control" data-region="search-filters"><!-- category rarity and value filter controls: rebuild the control's chrome from the crop (comp-spec.mjs --crop search-filters); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-search-action region control" data-region="search-action"><!-- yellow primary search button: rebuild the control's chrome from the crop (comp-spec.mjs --crop search-action); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-trade-ocean-field region texture" data-region="trade-ocean-field" style="background-image:url('../../../assets/plates/trade-ocean-field.png');background-repeat:repeat"></div>
  <div class="r-give-panel region chrome" data-region="give-panel"><!-- semantic Give item selection panel --></div>
  <div class="r-receive-panel region chrome" data-region="receive-panel"><!-- semantic Receive item selection panel --></div>
  <div class="r-give-heading region text" data-region="give-heading"><!-- Give heading and helper text --><p style="font-size:var(--r-give-heading-font);font-family:var(--r-give-heading-family),sans-serif;font-weight:var(--r-give-heading-weight);line-height:1.05;margin:0">give-heading</p></div>
  <div class="r-receive-heading region text" data-region="receive-heading"><!-- Receive heading and helper text --><p style="line-height:1.05;margin:0">receive-heading</p></div>
  <div class="r-give-items region control" data-region="give-items"><!-- six semantic item-picker tiles with small replaceable code-drawn catalog pictograms, names, and values: rebuild the control's chrome from the crop (comp-spec.mjs --crop give-items); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-receive-items region control" data-region="receive-items"><!-- six semantic item-picker tiles with small replaceable code-drawn catalog pictograms, names, and values: rebuild the control's chrome from the crop (comp-spec.mjs --crop receive-items); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-balance-result region control" data-region="balance-result"><!-- explicit Fair result, delta, percentage, and perspective: rebuild the control's chrome from the crop (comp-spec.mjs --crop balance-result); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-snapshot-panel region chrome" data-region="snapshot-panel"><!-- snapshot freshness and compact metrics --></div>
  <div class="r-snapshot-title region text" data-region="snapshot-title"><!-- Snapshot v024 and data status --><p style="line-height:1.05;margin:0">snapshot-title</p></div>
  <div class="r-recommendations region chrome" data-region="recommendations"><!-- three ranked recommended listing rows --></div>
  <div class="r-recommendation-controls region control" data-region="recommendation-controls"><!-- compact code-drawn item pictograms, values, status badges, and detail actions: rebuild the control's chrome from the crop (comp-spec.mjs --crop recommendation-controls); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-listing-title region text" data-region="listing-title"><!-- Listing Trade Terbaru section heading --><p style="line-height:1.05;margin:0">listing-title</p></div>
  <div class="r-listing-toolbar region control" data-region="listing-toolbar"><!-- sort and view controls: rebuild the control's chrome from the crop (comp-spec.mjs --crop listing-toolbar); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-listing-grid region chrome" data-region="listing-grid"><!-- four-column responsive latest-listing card grid container --></div>
  <div class="r-listing-card-one region control" data-region="listing-card-one"><!-- anonymous listing card with Give and Receive item groups, values, status, age, and detail action: rebuild the control's chrome from the crop (comp-spec.mjs --crop listing-card-one); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-listing-card-two region control" data-region="listing-card-two"><!-- anonymous listing card with Give and Receive item groups, values, status, age, and detail action: rebuild the control's chrome from the crop (comp-spec.mjs --crop listing-card-two); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-listing-card-three region control" data-region="listing-card-three"><!-- anonymous listing card with Give and Receive item groups, values, status, age, and detail action: rebuild the control's chrome from the crop (comp-spec.mjs --crop listing-card-three); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-listing-card-four region control" data-region="listing-card-four"><!-- anonymous listing card with Give and Receive item groups, values, status, age, and detail action: rebuild the control's chrome from the crop (comp-spec.mjs --crop listing-card-four); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
